<div class="flex justify-center items-center h-screen ">
  <div class="choice flex flex-col shadow-[8px_8px_0_0] shadow-neutral bg-base-200 border border-base-300 p-8">
    <h1 class=" border-b border-base-300">Hello World!</h1>


    <div class="flex justify-center items-center gap-4">
      <div class="choice__pill-wrapper" iconButton>
        <a [routerLink]="'resume' + '/'+ PAGES.ABOUT_ME.routeName">
          <img
            id="blue"
            src="assets/buttons/bluePill.svg"
            alt="Blue Pill"
            class="pill-logo w-32 h-32" height="31" width="25"
          >
        </a>
      </div>
      <div class="choice__pill-wrapper" iconButton>
        <a [routerLink]="PAGES.GAME.routeName">
          <img
            id="red"
            src="assets/buttons/redPill.svg"
            alt="red Pill"
            class="pill-logo w-32 h-32" height="31" width="25"
          >
        </a>
      </div>
    </div>
    <div class="flex justify-end gap-4">
      <app-theme-selector class="self-end "></app-theme-selector>
    </div>
  </div>
</div>
